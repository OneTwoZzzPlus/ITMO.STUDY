name: lab2

mgmt:
  network: mgmt
  ipv4-subnet: 172.20.20.0/24

topology:
  nodes:
    R01.MSK:
      kind: vr-ros
      image: vrnetlab/mikrotik_routeros:6.47.9
      mgmt-ipv4: 172.20.20.10
      startup-config: configs/R01.MSC.rsc
    R01.FRT:
      kind: vr-ros
      image: vrnetlab/mikrotik_routeros:6.47.9
      mgmt-ipv4: 172.20.20.20
      startup-config: configs/R01.FRT.rsc
    R01.BRL:
      kind: vr-ros
      image: vrnetlab/mikrotik_routeros:6.47.9
      mgmt-ipv4: 172.20.20.30
      startup-config: configs/R01.BRL.rsc
    PC1:
      kind: linux
      image: alpine:latest
      cmd: sleep infinity
      network-mode: none
      exec:
        - udhcpc -i eth1 -b
    PC2:
      kind: linux
      image: alpine:latest
      cmd: sleep infinity
      network-mode: none
      exec:
        - udhcpc -i eth1 -b
    PC3:
      kind: linux
      image: alpine:latest
      cmd: sleep infinity
      network-mode: none
      exec:
        - udhcpc -i eth1 -b
  links:
    - endpoints: ["R01.MSK:eth1", "R01.BRL:eth1"]
    - endpoints: ["R01.MSK:eth2", "R01.FRT:eth2"]
    - endpoints: ["R01.FRT:eth1", "R01.BRL:eth2"]
    - endpoints: ["R01.MSK:eth3", "PC1:eth1"]
    - endpoints: ["R01.FRT:eth3", "PC2:eth1"]
    - endpoints: ["R01.BRL:eth3", "PC3:eth1"]
